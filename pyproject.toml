[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "postal-gambit"
description = "Correspondence chess over your own email client"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Oliver Ernster" }]
dynamic = ["version"]

[tool.setuptools]
packages = ["postalgambit"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# The gate covers the package plus the two Qt-free halves of the setup program.
# The installer does the most privileged work in the product (registry writes,
# the postalgambit: URI registration, shortcut creation, per-user deployment,
# uninstall), so its operations and its state model are gated rather than left
# unmeasured. installer/ui, installer/app.py, installer/cli.py, the constants
# and installer/shared are the Qt client and its wiring, excluded on the same
# grounds as postalgambit/ui.
addopts = "--cov=postalgambit --cov=installer.ops --cov=installer.state --cov-branch --cov-fail-under=100 --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["postalgambit", "installer.ops", "installer.state"]
omit = [
    "postalgambit/ui/*",
    "postalgambit/version.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]
